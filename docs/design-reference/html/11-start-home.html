<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'aktywa', hidden: false };
  }
  renderVals() {
    const tab = this.state.tab;
    const hidden = this.state.hidden;
    const mask = '••••';
    const defs = [
      { id: 'aktywa', label: 'Aktywa' },
      { id: 'rynek', label: 'Rynek' },
      { id: 'skarbce', label: 'Skarbce' }
    ];
    return {
      tabs: defs.map((d) => ({
        label: d.label,
        pressed: d.id === tab ? 'true' : 'false',
        style: d.id === tab ? 'background: #17151F; color: #FFFFFF;' : 'background: transparent; color: #5E5A6E;',
        pick: () => this.setState({ tab: d.id })
      })),
      isAktywa: tab === 'aktywa',
      isRynek: tab === 'rynek',
      isSkarbce: tab === 'skarbce',
      hidden: hidden,
      shown: !hidden,
      eyeLabel: hidden ? 'Pokaż saldo' : 'Ukryj saldo',
      toggleHidden: () => this.setState({ hidden: !this.state.hidden }),
      balInt: hidden ? mask : '17',
      balDec: hidden ? ' zł' : ',66 zł',
      changeAbs: hidden ? mask + ' zł' : '−0,26 zł',
      solAmt: hidden ? mask + ' SOL' : '0,1499 SOL',
      solVal: hidden ? mask : '17,13 zł',
      ethAmt: hidden ? mask + ' ETH' : '0,0002 ETH',
      ethVal: hidden ? mask : '0,53 zł'
    };
  }
}
</script>
