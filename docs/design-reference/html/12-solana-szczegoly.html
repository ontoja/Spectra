<defs><linearGradient id="assetFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6046E8" stop-opacity="0.18"></stop><stop offset="1" stop-color="#6046E8" stop-opacity="0"></stop></linearGradient></defs>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: '1D' };
  }
  series(seed, n, vol) {
    let s = seed;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const pts = [114.28];
    for (let i = 1; i < n; i++) {
      pts.unshift(pts[0] * (1 + (rnd() - 0.47) * vol));
    }
    return pts;
  }
  renderVals() {
    const defs = [
      { id: '1D', label: '1D', seed: 11, n: 48, vol: 0.006, name: 'ostatni dzień' },
      { id: '1T', label: '1T', seed: 29, n: 56, vol: 0.014, name: 'ostatni tydzień' },
      { id: '1M', label: '1M', seed: 47, n: 60, vol: 0.022, name: 'ostatni miesiąc' },
      { id: '1R', label: '1R', seed: 83, n: 64, vol: 0.045, name: 'ostatni rok' },
      { id: 'ALL', label: 'Wsz.', seed: 101, n: 70, vol: 0.06, name: 'cała historia' }
    ];
    const cur = defs.find((d) => d.id === this.state.range) || defs[0];
    const pts = this.series(cur.seed, cur.n, cur.vol);
    const W = 390, H = 180, top = 16, bottom = 16;
    const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    const span = max - min || 1;
    const xy = pts.map((v, i) => [
      +(i * (W - 14) / (pts.length - 1)).toFixed(1),
      +(top + (1 - (v - min) / span) * (H - top - bottom)).toFixed(1)
    ]);
    const line = 'M' + xy.map((p) => p[0] + ' ' + p[1]).join(' L');
    const last = xy[xy.length - 1];
    return {
      ranges: defs.map((d) => ({
        label: d.label,
        pressed: d.id === cur.id ? 'true' : 'false',
        style: d.id === cur.id ? 'background: #17151F; color: #FFFFFF;' : 'background: transparent; color: #5E5A6E;',
        pick: () => this.setState({ range: d.id })
      })),
      line: line,
      area: line + ' L' + last[0] + ' ' + H + ' L0 ' + H + ' Z',
      dotX: last[0],
      dotY: last[1],
      chartLabel: 'Wykres ceny Solana, ' + cur.name
    };
  }
}
</script>
