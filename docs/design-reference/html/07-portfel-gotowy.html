<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<title>Spectra — Portfel gotowy</title>

</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0;background:#F5F3FA;font-family:'Instrument Sans',system-ui,sans-serif;color:#17151F}
a{color:inherit;text-decoration:none}a:hover{color:#4A33C9}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
@keyframes spPop{0%{transform:scale(0.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes spDraw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes spPulse{0%{transform:scale(0.8);opacity:0.55}100%{transform:scale(1.7);opacity:0}}
@keyframes spB1{0%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}100%{transform:translate(-78px,-54px) scale(1);opacity:0}}@keyframes spB2{0%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}100%{transform:translate(80px,-46px) scale(1);opacity:0}}@keyframes spB3{0%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}100%{transform:translate(70px,66px) scale(1);opacity:0}}@keyframes spB4{0%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}100%{transform:translate(-72px,62px) scale(1);opacity:0}}
@keyframes spRise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spSheet{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion: reduce){.sp-anim{animation:none !important;opacity:1 !important;stroke-dashoffset:0 !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; isolation: isolate; background: #F5F3FA; color: #17151F; font-family: 'Instrument Sans', system-ui, sans-serif;">
<div aria-hidden="true" style="position: absolute; top: -10%; left: -25%; right: -25%; bottom: -10%; z-index: 0; filter: blur(52px); background: radial-gradient(36% 22% at 50% 20%, rgba(160,230,200,0.75) 0%, rgba(160,230,200,0) 100%), radial-gradient(30% 22% at 12% 44%, rgba(171,159,242,0.60) 0%, rgba(171,159,242,0) 100%), radial-gradient(32% 22% at 88% 52%, rgba(255,188,160,0.50) 0%, rgba(255,188,160,0) 100%), radial-gradient(30% 22% at 50% 94%, rgba(150,196,255,0.50) 0%, rgba(150,196,255,0) 100%);"></div>

<div style="position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding: 88px 20px 30px; display: flex; flex-direction: column; align-items: center;">

<div aria-hidden="true" style="position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center;">
<span class="sp-anim" style="position: absolute; top: 26px; left: 26px; width: 128px; height: 128px; border-radius: 64px; border: 2px solid rgba(18,129,79,0.45); box-sizing: border-box; display: block; opacity: 0; animation: spPulse 1.8s ease-out 0.5s infinite;"></span>
<span class="sp-anim" style="position: absolute; top: 26px; left: 26px; width: 128px; height: 128px; border-radius: 64px; border: 2px solid rgba(96,70,232,0.35); box-sizing: border-box; display: block; opacity: 0; animation: spPulse 1.8s ease-out 1.1s infinite;"></span>
<span class="sp-anim" style="position: absolute; top: 84px; left: 84px; width: 12px; height: 12px; border-radius: 6px; background: #8B6CFF; display: block; opacity: 0; animation: spB1 0.9s ease-out 0.35s forwards;"></span>
<span class="sp-anim" style="position: absolute; top: 84px; left: 84px; width: 10px; height: 10px; border-radius: 5px; background: #FF9A76; display: block; opacity: 0; animation: spB2 0.9s ease-out 0.4s forwards;"></span>
<span class="sp-anim" style="position: absolute; top: 84px; left: 84px; width: 10px; height: 10px; border-radius: 5px; background: #4FA3FF; display: block; opacity: 0; animation: spB3 0.9s ease-out 0.45s forwards;"></span>
<span class="sp-anim" style="position: absolute; top: 84px; left: 84px; width: 12px; height: 12px; border-radius: 6px; background: #3DDBB0; display: block; opacity: 0; animation: spB4 0.9s ease-out 0.5s forwards;"></span>
<span class="sp-anim" style="width: 120px; height: 120px; border-radius: 40px; display: flex; align-items: center; justify-content: center; opacity: 0; animation: spPop 0.6s cubic-bezier(.2,.9,.3,1.2) 0.1s forwards; background: rgba(255,255,255,0.6); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 20px 44px rgba(18,129,79,0.18), inset 0 1px 0 rgba(255,255,255,1);">
<svg width="64" height="64" sc-camel-view-box="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="10" fill="#12814F"></circle>
<path class="sp-anim" d="M7.5 12.5l3 3 6-6.5" stroke="#FFFFFF" stroke-width="2.4" stroke-dasharray="40" stroke-dashoffset="40" style="animation: spDraw 0.45s ease-out 0.55s forwards;"></path>
</svg>
</span>
</div>

<div class="sp-anim" style="display: flex; flex-direction: column; align-items: center; opacity: 0; animation: spRise 0.5s ease-out 0.7s forwards;">
<h1 style="margin: 20px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.03em;">Portfel gotowy</h1>
<p style="margin: 8px 0 0; max-width: 300px; text-align: center; font-size: 15px; line-height: 1.45; color: #5E5A6E;">Konto 1 działa w 3 sieciach. Dotknij sieci, żeby zobaczyć pełny adres i kod QR.</p>
</div>

<div class="sp-anim" style="margin-top: 22px; width: 100%; box-sizing: border-box; border-radius: 26px; padding: 4px 12px 4px 16px; opacity: 0; animation: spRise 0.5s ease-out 0.9s forwards; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 12px 32px rgba(48,36,110,0.08), inset 0 1px 0 rgba(255,255,255,0.95);">
<sc-for list="{{nets}}" as="n" hint-placeholder-count="3">
<button aria-label="{{n.aria}}" sc-camel-on-click="{{n.open}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; text-align: left; {{n.divider}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; background: {{n.grad}};">{{n.letter}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;">{{n.name}}
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #0F6E43;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #12814F; display: block;"></span>Aktywne</span>
</span>
<span style="font-size: 12px; color: #5E5A6E; font-family: ui-monospace, 'SF Mono', Menlo, monospace;">{{n.short}}</span>
</span>
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: rgba(255,255,255,0.85); color: #4A33C9; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M14 14h3v3M21 14v.01M14 21h.01M17.5 17.5H21V21h-3.5z"></path></svg>
</span>
</button>
</sc-for>
</div>

<div class="sp-anim" style="margin-top: 12px; width: 100%; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; opacity: 0; animation: spRise 0.5s ease-out 1.05s forwards;">
<span style="height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.7);"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#12814F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>PIN</span>
<sc-if value="{{bioOn}}" hint-placeholder-val="{{ true }}">
<span style="height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.7);"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#12814F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Biometria</span>
</sc-if>
<span style="height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.7);"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#12814F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Kopia potwierdzona</span>
</div>

<div style="flex-grow: 1;"></div>
<a href="Main.dc.html" style="width: 100%; height: 56px; border-radius: 28px; background: #6046E8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; box-shadow: 0 12px 26px rgba(96,70,232,0.32), inset 0 1px 0 rgba(255,255,255,0.3);">Przejdź do portfela</a>
</div>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<button aria-label="Zamknij" sc-camel-on-click="{{close}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(23,21,31,0.28); cursor: default;"></button>
<div class="sp-anim" role="dialog" aria-modal="true" aria-labelledby="addr-title" style="position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6; padding: 10px 20px 22px; border-radius: 34px; display: flex; flex-direction: column; align-items: center; animation: spSheet 0.28s ease-out; background: rgba(255,255,255,0.88); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 -10px 40px rgba(48,36,110,0.18);">
<span aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: rgba(23,21,31,0.18); display: block;"></span>
<div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 8px;">
<div style="display: flex; align-items: center; gap: 10px;">
<span style="width: 32px; height: 32px; border-radius: 16px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: {{sel.grad}};">{{sel.letter}}</span>
<h2 id="addr-title" style="margin: 0; font-size: 18px; font-weight: 600;">Adres {{sel.name}}</h2>
</div>
<button aria-label="Zamknij" sc-camel-on-click="{{close}}" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; margin-right: -8px;">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<div style="margin-top: 8px; width: 100%; box-sizing: border-box; display: flex; gap: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(214,140,20,0.12); color: #7A4B00; font-size: 13px; line-height: 1.4;">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17v.01"></path></svg>
<span>{{sel.warning}}</span>
</div>

<div style="margin-top: 14px; position: relative; padding: 12px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 6px 20px rgba(48,36,110,0.08);">
<svg width="196" height="196" sc-camel-view-box="-2 -2 29 29" role="img" aria-label="{{qrLabel}}" shape-rendering="crispEdges" style="display: block;">
<path d="{{qrPath}}" fill="#17151F"></path>
</svg>
<span aria-hidden="true" style="position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 20px; border: 4px solid #FFFFFF; box-sizing: border-box; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; background: {{sel.grad}};">{{sel.letter}}</span>
</div>

<p style="margin: 14px 0 0; max-width: 300px; text-align: center; font-size: 15px; line-height: 1.5; font-weight: 500; word-break: break-all; font-family: ui-monospace, 'SF Mono', Menlo, monospace;">{{sel.grouped}}</p>

<div style="margin-top: 16px; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<button sc-camel-on-click="{{copy}}" style="height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; {{copyStyle}}">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8"></path></svg>
<span aria-live="polite">{{copyLabel}}</span>
</button>
<button style="height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; background: rgba(23,21,31,0.06);">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
Udostępnij
</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;biometricsEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: null, copied: false };
    this.timer = null;
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  qr(seedText) {
    // Wzór poglądowy (nie da się go zeskanować) — w aplikacji generuje go biblioteka QR z pełnego adresu.
    const N = 25;
    let s = 0;
    for (let i = 0; i < seedText.length; i++) s = (s * 31 + seedText.charCodeAt(i)) % 2147483647;
    const rnd = () => { s = (s * 48271) % 2147483647; return s / 2147483647; };
    const finder = (x, y, fx, fy) => {
      const dx = x - fx, dy = y - fy;
      if (dx < -1 || dy < -1 || dx > 7 || dy > 7) return null;
      if (dx === -1 || dy === -1 || dx === 7 || dy === 7) return false;
      if (dx === 0 || dy === 0 || dx === 6 || dy === 6) return true;
      if (dx === 1 || dy === 1 || dx === 5 || dy === 5) return false;
      return true;
    };
    let d = '';
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        let on = null;
        const fs = [[0, 0], [N - 7, 0], [0, N - 7]];
        for (let k = 0; k < 3 && on === null; k++) on = finder(x, y, fs[k][0], fs[k][1]);
        if (on === null) {
          if (x >= 10 && x <= 14 && y >= 10 && y <= 14) on = false;
          else if (y === 6) on = x % 2 === 0;
          else if (x === 6) on = y % 2 === 0;
          else on = rnd() < 0.5;
        }
        if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
      }
    }
    return d;
  }
  renderVals() {
    const data = [
      { id: 'SOL', name: 'Solana', letter: 'S', grad: 'linear-gradient(135deg, #8B6CFF, #3DDBB0)', addr: '7xKpQ4mVb9TzR2nLwE8hJc6YdA3sFuG5kN1rPq3fQa', warning: 'Wysyłaj tu tylko SOL i tokeny z sieci Solana. Środki z innej sieci mogą przepaść.' },
      { id: 'ETH', name: 'Ethereum', letter: 'E', grad: 'linear-gradient(135deg, #9AAEFF, #5A6CF0)', addr: '0x3f2A8c71D9e4B05a6F1c2E9d7B4a03C8e5F691cB', warning: 'Wysyłaj tu tylko ETH i tokeny z sieci Ethereum. Środki z innej sieci mogą przepaść.' },
      { id: 'LTC', name: 'Litecoin', letter: 'Ł', grad: 'linear-gradient(135deg, #C3CCDA, #6E7F99)', addr: 'ltc1q9x7d4h2kq5w8e3r6t0y2u4j7z9p6a3s5d8mz4', warning: 'Wysyłaj tu tylko LTC. Środki z innej sieci mogą przepaść.' }
    ];
    const short = (a) => a.slice(0, a.startsWith('ltc1q') ? 5 : (a.startsWith('0x') ? 6 : 4)) + '…' + a.slice(-4);
    const st = this.state;
    const sel = data.find((n) => n.id === st.open) || data[0];
    return {
      nets: data.map((n, i) => ({
        name: n.name,
        letter: n.letter,
        grad: n.grad,
        short: short(n.addr),
        aria: 'Pokaż pełny adres i kod QR — ' + n.name,
        divider: i < data.length - 1 ? 'border-bottom: 1px solid rgba(23,21,31,0.07);' : '',
        open: () => this.setState({ open: n.id, copied: false })
      })),
      bioOn: this.props.biometricsEnabled ?? true,
      sheetOpen: st.open !== null,
      close: () => this.setState({ open: null }),
      sel: {
        name: sel.name,
        letter: sel.letter,
        grad: sel.grad,
        warning: sel.warning,
        grouped: sel.addr.match(/.{1,4}/g).join(' ')
      },
      qrPath: this.qr(sel.addr),
      qrLabel: 'Kod QR adresu ' + sel.name,
      copy: () => {
        this.setState({ copied: true });
        if (this.timer) clearTimeout(this.timer);
        this.timer = setTimeout(() => this.setState({ copied: false }), 1600);
      },
      copyLabel: st.copied ? 'Skopiowano' : 'Kopiuj adres',
      copyStyle: st.copied ? 'background: #12814F; color: #FFFFFF;' : 'background: #6046E8; color: #FFFFFF;'
    };
  }
}
</script>


</body></html>
