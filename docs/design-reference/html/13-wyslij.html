<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<title>Portfel — Wyślij SOL</title>

</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0;background:#F5F3FA;font-family:'Instrument Sans',system-ui,sans-serif;color:#17151F}
a{color:inherit;text-decoration:none}a:hover{color:#4A33C9}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
input::placeholder{color:#76728A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; isolation: isolate; background: #F5F3FA; color: #17151F; font-family: 'Instrument Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums;">
<div aria-hidden="true" style="position: absolute; top: -10%; left: -25%; right: -25%; bottom: -10%; z-index: 0; filter: blur(48px); background: radial-gradient(34% 22% at 20% 12%, rgba(150,196,255,0.60) 0%, rgba(150,196,255,0) 100%), radial-gradient(32% 22% at 86% 30%, rgba(171,159,242,0.65) 0%, rgba(171,159,242,0) 100%), radial-gradient(34% 22% at 14% 74%, rgba(255,188,160,0.45) 0%, rgba(255,188,160,0) 100%), radial-gradient(30% 20% at 84% 92%, rgba(160,230,200,0.45) 0%, rgba(160,230,200,0) 100%);"></div>

<div style="position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding: 56px 20px 30px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<a href="Main.dc.html" aria-label="Zamknij" style="width: 44px; height: 44px; border-radius: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 24px rgba(48,36,110,0.07), inset 0 1px 0 rgba(255,255,255,0.95);">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600;">Wyślij</h1>
<span style="width: 44px; height: 44px;"></span>
</div>

<div style="border-radius: 26px; padding: 4px 6px 4px 14px; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 12px 32px rgba(48,36,110,0.08), inset 0 1px 0 rgba(255,255,255,0.95);">
<button aria-label="Zmień aktywo, wybrane: Solana" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 0; text-align: left; border-bottom: 1px solid rgba(23,21,31,0.07);">
<span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 19px; background: linear-gradient(135deg, #8B6CFF, #3DDBB0); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;">S</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
<span style="font-size: 15px; font-weight: 600;">Solana</span>
<span style="font-size: 13px; color: #5E5A6E;">Dostępne 0,1499 SOL</span>
</span>
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5E5A6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<div style="display: flex; align-items: center; gap: 4px; min-height: 56px;">
<label for="recipient" style="font-size: 15px; font-weight: 600; width: 38px; color: #5E5A6E;">Do</label>
<input id="recipient" type="text" placeholder="Adres lub nazwa .sol" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; color: #17151F; font: inherit; font-size: 15px;">
<button aria-label="Wklej adres" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #6046E8;">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"></rect><path d="M16 5h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2"></path></svg>
</button>
<button aria-label="Skanuj kod QR" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #6046E8;">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"></path></svg>
</button>
</div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
<div aria-live="polite" style="display: flex; align-items: baseline; gap: 8px; letter-spacing: -0.04em;">
<span style="font-size: {{amountSize}}px; font-weight: 600; line-height: 1; color: {{amountColor}};">{{amount}}</span>
<span style="font-size: 26px; font-weight: 600; color: #5E5A6E;">SOL</span>
</div>
<div style="display: flex; align-items: center; gap: 10px;">
<span style="font-size: 15px; color: #5E5A6E;">≈ {{fiat}}</span>
<button sc-camel-on-click="{{setMax}}" style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(96,70,232,0.12); color: #4A33C9; font-size: 13px; font-weight: 700;">Max</button>
</div>
<sc-if value="{{over}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 600; color: #B42A40;">Za mało środków na koncie</span>
</sc-if>
<sc-if value="{{notOver}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 13px; color: #5E5A6E;">Opłata sieciowa ≈ 0,000005 SOL</span>
</sc-if>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button aria-label="{{k.aria}}" sc-camel-on-click="{{k.press}}" style="height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500;">
<sc-if value="{{k.isDel}}" hint-placeholder-val="{{ false }}">
<svg width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"></path><path d="M13 10l4 4M17 10l-4 4"></path></svg>
</sc-if>
<sc-if value="{{k.isChar}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
</button>
</sc-for>
</div>

<button disabled="{{disabled}}" style="height: 56px; border-radius: 28px; font-size: 16px; font-weight: 600; {{ctaStyle}}">Dalej</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: '0' };
  }
  press(k) {
    let a = this.state.amount;
    if (k === 'del') {
      a = a.length > 1 ? a.slice(0, -1) : '0';
    } else if (k === ',') {
      if (a.indexOf(',') === -1) a = a + ',';
    } else {
      const dec = a.split(',')[1];
      if (dec !== undefined && dec.length >= 4) return;
      if (a.length >= 9) return;
      a = a === '0' ? k : a + k;
    }
    this.setState({ amount: a });
  }
  renderVals() {
    const a = this.state.amount;
    const num = parseFloat(a.replace(',', '.')) || 0;
    const over = num > 0.1499;
    const fiat = (num * 114.28).toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' zł';
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'del'];
    const disabled = num <= 0 || over;
    return {
      amount: a,
      amountSize: a.length > 6 ? 48 : 64,
      amountColor: over ? '#B42A40' : (num > 0 ? '#17151F' : '#8A8699'),
      fiat: fiat,
      over: over,
      notOver: !over,
      setMax: () => this.setState({ amount: '0,1498' }),
      keys: labels.map((l) => ({
        label: l,
        isDel: l === 'del',
        isChar: l !== 'del',
        aria: l === 'del' ? 'Usuń cyfrę' : (l === ',' ? 'Przecinek' : l),
        press: () => this.press(l)
      })),
      disabled: disabled,
      ctaStyle: disabled ? 'background: rgba(23,21,31,0.06); color: #8A8699; cursor: default;' : 'background: #6046E8; color: #FFFFFF; box-shadow: 0 10px 22px rgba(96,70,232,0.30);'
    };
  }
}
</script>


</body></html>
