<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<title>Spectra — Przygotowanie portfela</title>

</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0;background:#F5F3FA;font-family:'Instrument Sans',system-ui,sans-serif;color:#17151F}
a{color:inherit;text-decoration:none}a:hover{color:#4A33C9}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){.sp-anim{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; isolation: isolate; background: #F5F3FA; color: #17151F; font-family: 'Instrument Sans', system-ui, sans-serif;">
<div aria-hidden="true" style="position: absolute; top: -10%; left: -25%; right: -25%; bottom: -10%; z-index: 0; filter: blur(52px); background: radial-gradient(36% 22% at 50% 20%, rgba(171,159,242,0.80) 0%, rgba(171,159,242,0) 100%), radial-gradient(30% 22% at 12% 46%, rgba(160,230,200,0.50) 0%, rgba(160,230,200,0) 100%), radial-gradient(32% 22% at 88% 50%, rgba(150,196,255,0.55) 0%, rgba(150,196,255,0) 100%), radial-gradient(30% 22% at 50% 92%, rgba(255,188,160,0.45) 0%, rgba(255,188,160,0) 100%);"></div>

<div style="position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding: 96px 20px 30px; display: flex; flex-direction: column; align-items: center;">

<div aria-hidden="true" style="position: relative; width: 196px; height: 196px; display: flex; align-items: center; justify-content: center;">
<svg class="sp-anim" width="196" height="196" sc-camel-view-box="0 0 196 196" style="position: absolute; top: 0; left: 0; animation: spSpin 6s linear infinite;">
<circle cx="98" cy="98" r="88" fill="none" stroke="rgba(96,70,232,0.22)" stroke-width="1.5" stroke-dasharray="3 7"></circle>
<circle cx="98" cy="10" r="7" fill="#8B6CFF"></circle>
<circle cx="174.2" cy="142" r="7" fill="#5A6CF0"></circle>
<circle cx="21.8" cy="142" r="7" fill="#7D8BA6"></circle>
</svg>
<svg class="sp-anim" width="150" height="150" sc-camel-view-box="0 0 150 150" style="position: absolute; top: 23px; left: 23px; animation: spSpin 2.4s linear infinite reverse; opacity: {{arcOpacity}};">
<circle cx="75" cy="75" r="70" fill="none" stroke="#6046E8" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 350"></circle>
</svg>
<span class="sp-anim" style="width: 112px; height: 112px; border-radius: 36px; display: flex; align-items: center; justify-content: center; animation: spBreath 2.4s ease-in-out infinite; background: rgba(255,255,255,0.6); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 20px 44px rgba(48,36,110,0.16), inset 0 1px 0 rgba(255,255,255,1);">
<svg width="64" height="64" sc-camel-view-box="0 0 64 64"><circle cx="24" cy="25" r="15" fill="#8B6CFF" fill-opacity="0.78"></circle><circle cx="40" cy="25" r="15" fill="#FF9A76" fill-opacity="0.72"></circle><circle cx="32" cy="39" r="15" fill="#4FA3FF" fill-opacity="0.70"></circle><circle cx="32" cy="30" r="5" fill="#FFFFFF" fill-opacity="0.9"></circle></svg>
</span>
</div>

<h1 style="margin: 32px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; text-align: center;">{{title}}</h1>
<p style="margin: 8px 0 0; max-width: 300px; text-align: center; font-size: 15px; line-height: 1.45; color: #5E5A6E;">Generujemy klucze z twojej frazy i zapisujemy je zaszyfrowane na telefonie. Nic nie wychodzi do sieci.</p>

<div style="margin-top: 24px; width: 100%; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; padding: 0 4px;">
<span aria-live="polite" style="color: #5E5A6E;">{{taskLabel}}</span>
<span style="flex-shrink: 0;">{{doneCount}} z 6 kroków</span>
</div>
<div role="progressbar" aria-label="Tworzenie i zapisywanie kont" aria-valuemin="0" aria-valuemax="6" aria-valuenow="{{doneCount}}" style="height: 8px; border-radius: 4px; background: rgba(23,21,31,0.08); overflow: hidden;">
<span style="display: block; height: 100%; border-radius: 4px; background: #6046E8; transition: width 0.35s ease; width: {{barWidth}}%;"></span>
</div>
</div>

<div style="margin-top: 16px; width: 100%; box-sizing: border-box; border-radius: 26px; padding: 4px 16px; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 12px 32px rgba(48,36,110,0.08), inset 0 1px 0 rgba(255,255,255,0.95);">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; {{r.divider}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; transition: opacity 0.3s; background: {{r.grad}}; opacity: {{r.iconOpacity}};">{{r.letter}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 15px; font-weight: 600;">{{r.name}}</span>
<span style="font-size: 12px; color: #5E5A6E; font-family: ui-monospace, 'SF Mono', Menlo, monospace;">{{r.path}}</span>
</span>
<sc-if value="{{r.isDone}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #12814F;">
<span style="width: 24px; height: 24px; border-radius: 12px; background: #12814F; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
<svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
Gotowe
</span>
</sc-if>
<sc-if value="{{r.isActive}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #4A33C9;">
<span class="sp-anim" style="width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 2.5px solid rgba(96,70,232,0.2); border-top-color: #6046E8; display: block; animation: spSpin 0.8s linear infinite;"></span>
{{r.activeLabel}}
</span>
</sc-if>
<sc-if value="{{r.isWaiting}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 600; color: #5E5A6E;">Czeka</span>
</sc-if>
</div>
</sc-for>
</div>

<div style="flex-grow: 1;"></div>
<sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
<a href="Ready.dc.html" style="width: 100%; height: 56px; border-radius: 28px; background: #6046E8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; box-shadow: 0 12px 26px rgba(96,70,232,0.32), inset 0 1px 0 rgba(255,255,255,0.3);">Dalej</a>
</sc-if>
<sc-if value="{{working}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; height: 56px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5E5A6E;">Nie zamykaj aplikacji</p>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: 0 };
    this.timers = [];
  }
  componentDidMount() {
    // Pasek idzie za prawdziwymi krokami: dla każdej sieci (1) wyprowadzenie klucza z frazy,
    // (2) zapis zaszyfrowanego konta w Android Keystore. Każdy krok zgłasza koniec sam —
    // bez minimalnego czasu wyświetlania. Poniższe czasy tylko udają w makiecie różną długość pracy.
    const durations = [380, 210, 340, 190, 620, 230];
    let t = 0;
    durations.forEach((d, i) => {
      t += d;
      this.timers.push(setTimeout(() => this.setState({ done: i + 1 }), t));
    });
  }
  componentWillUnmount() {
    this.timers.forEach((t) => clearTimeout(t));
  }
  renderVals() {
    const done = this.state.done;
    const nets = [
      { name: 'Solana', letter: 'S', grad: 'linear-gradient(135deg, #8B6CFF, #3DDBB0)', path: "m/44'/501'/0'/0'" },
      { name: 'Ethereum', letter: 'E', grad: 'linear-gradient(135deg, #9AAEFF, #5A6CF0)', path: "m/44'/60'/0'/0/0" },
      { name: 'Litecoin', letter: 'Ł', grad: 'linear-gradient(135deg, #C3CCDA, #6E7F99)', path: "m/84'/2'/0'/0/0" }
    ];
    const finished = done >= 6;
    const cur = Math.floor(done / 2);
    const saving = done % 2 === 1;
    let taskLabel = 'Wszystkie konta zapisane';
    if (!finished) taskLabel = (saving ? 'Zapisywanie konta ' : 'Generowanie klucza ') + nets[cur].name;
    return {
      title: finished ? 'Wszystko gotowe' : 'Przygotowujemy portfel',
      doneCount: done,
      taskLabel: taskLabel,
      barWidth: Math.round(done / 6 * 100),
      arcOpacity: finished ? 0 : 1,
      allDone: finished,
      working: !finished,
      rows: nets.map((n, i) => ({
        name: n.name,
        letter: n.letter,
        grad: n.grad,
        path: n.path,
        isDone: i < cur || finished,
        isActive: !finished && i === cur,
        isWaiting: !finished && i > cur,
        activeLabel: saving ? 'Zapisywanie' : 'Generowanie',
        iconOpacity: !finished && i > cur ? 0.4 : 1,
        divider: i < 2 ? 'border-bottom: 1px solid rgba(23,21,31,0.07);' : ''
      }))
    };
  }
}
</script>


</body></html>
